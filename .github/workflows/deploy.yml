name: Build APK
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
      
      - name: Prepare Web Files
        run: |
          # Buat folder www
          mkdir -p www
          
          # Copy semua file HTML ke www
          cp *.html www/ 2>/dev/null || echo "No HTML files found"
          
          # Jika ada file HTML, rename ke index.html
          if ls www/*.html 1> /dev/null 2>&1; then
            FIRST_HTML=$(ls www/*.html | head -1)
            mv "$FIRST_HTML" www/index.html
            echo "✅ index.html created"
          fi
          
          # Copy file pendukung
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          
          echo "📁 Files in www:"
          ls -la www/
      
      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.fotocraft.studio",
            "appName": "FotoCraft Studio",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          
          echo "✅ capacitor.config.json created"
          cat capacitor.config.json
      
      - name: Initialize Capacitor
        run: |
          npx cap init FotoCraft Studio com.fotocraft.studio --web-dir=www
          npx cap add android
      
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoCraft-APK
          path: android/app/build/outputs/apk/release/app-release.apk