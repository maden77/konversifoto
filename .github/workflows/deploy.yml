name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
      
      - name: Prepare Files
        run: |
          # Buat folder www
          mkdir -p www
          
          # Cari file HTML pertama
          HTML_FILE=$(ls *.html 2>/dev/null | head -1)
          
          if [ -n "$HTML_FILE" ]; then
            # Copy ke www sebagai index.html
            cp "$HTML_FILE" www/index.html
            echo "✅ Copied $HTML_FILE to www/index.html"
          else
            echo "❌ No HTML file found!"
            exit 1
          fi
          
          # Copy file pendukung
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          
          echo "📁 Files in www:"
          ls -la www/
      
      - name: Create Config
        run: |
          echo '{"appId":"com.fotocraft.studio","appName":"FotoCraft","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
      
      - name: Build
        run: |
          npx cap init FotoCraft com.fotocraft.studio --web-dir=www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleRelease
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoCraft-APK
          path: android/app/build/outputs/apk/release/app-release.apk