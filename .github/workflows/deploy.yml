name: Deploy FotoCraft Studio to GitHub Pages

on:
  # Jalankan workflow setiap kali ada push ke branch main / master
  push:
    branches:
      - main
      - master
  # Mengizinkan penjalanan workflow secara manual dari tab Actions
  workflow_dispatch:

# Mengatur izin GITHUB_TOKEN untuk memungkinkan penyebaran (deployment) ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Izinkan hanya satu deployment bersamaan
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Pekerjaan 1: Validasi & Pengecekan Kode
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validasi Berkas HTML
        run: |
          if [ ! -f index.html ]; then
            echo "Error: Berkas index.html tidak ditemukan di root repositori!"
            exit 1
          fi
          echo "Pengecekan berhasil: index.html ditemukan."

  # Pekerjaan 2: Deployment ke GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Unggah seluruh isi repositori (termasuk index.html)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
