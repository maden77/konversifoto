name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
      - name: Build APK
        run: |
          mkdir -p www
          # Buat file HTML default jika tidak ada
          if [ ! -f "index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>FotoCraft</title></head><body><h1>FotoCraft Studio</h1></body></html>' > index.html
          fi
          cp index.html www/
          echo '{"appId":"com.fotocraft.studio","appName":"FotoCraft","webDir":"www"}' > capacitor.config.json
          npx cap init FotoCraft com.fotocraft.studio --web-dir=www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoCraft-APK
          path: android/app/build/outputs/apk/release/app-release.apk